name: CI

# TEMPORARILY DISABLED DURING WAVE CONTRIBUTION PERIOD
# To re-enable after Wave: change 'workflow_dispatch' back to:
# on:
#   push:
#     branches: [main, develop]
#   pull_request:
#     branches: [main, develop]
on:
  workflow_dispatch: # Manual trigger only - effectively disables automatic CI during Wave

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint React hooks
        run: npx eslint -c .eslintrc.override.json src/react/

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

